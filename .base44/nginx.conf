# Path router mirroring the Replit artifact routing (/api, /silent-lantern/, /).
# Docker DNS resolver + variables so recreated containers are re-resolved.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  resolver 127.0.0.11 valid=10s;
  set $api api:8080;
  set $lantern silent-lantern:18303;
  set $iron iron-meridian:25140;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-Proto https;
  location /api/ { proxy_pass http://$api; }
  location /silent-lantern/ { proxy_pass http://$lantern; }
  location / { proxy_pass http://$iron; }
}
