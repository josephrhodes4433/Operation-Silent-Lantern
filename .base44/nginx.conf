# Path router mirroring the Replit artifact routing (/api, /silent-lantern/, /).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-Proto https;
  location /api/ { proxy_pass http://api:8080; }
  location /silent-lantern/ { proxy_pass http://silent-lantern:18303; }
  location / { proxy_pass http://iron-meridian:25140; }
}
