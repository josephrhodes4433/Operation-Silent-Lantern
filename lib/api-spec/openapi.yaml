openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ctf
    description: Operation IRON MERIDIAN capture-the-flag activity
  - name: instructor
    description: Instructor-only answer-key and review operations
paths:
  /ctf/leaderboard:
    get:
      operationId: getCtfLeaderboard
      responses:
        "200":
          description: Public team completion only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamLeaderboard" }
  /lantern/leaderboard:
    get:
      operationId: getLanternLeaderboard
      responses:
        "200":
          description: Public team completion only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamLeaderboard" }
  /ctf/instructor/review-queue:
    get:
      operationId: getCtfReviewQueue
      parameters:
        - { in: header, name: x-instructor-code, required: true, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [time_asc, time_desc, name_asc, name_desc], default: time_asc } }
      responses:
        "200":
          description: Latest non-choice responses awaiting instructor decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
  /lantern/instructor/review-queue:
    get:
      operationId: getLanternReviewQueue
      parameters:
        - { in: header, name: x-instructor-code, required: true, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [time_asc, time_desc, name_asc, name_desc], default: time_asc } }
      responses:
        "200":
          description: Latest non-choice responses awaiting instructor decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
  /ctf/instructor/notifications:
    get:
      operationId: getCtfNotifications
      parameters:
        - { in: header, name: x-instructor-code, required: true, schema: { type: string } }
      responses:
        "200":
          description: Durable team completion notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletionNotifications" }
  /lantern/instructor/notifications:
    get:
      operationId: getLanternNotifications
      parameters:
        - { in: header, name: x-instructor-code, required: true, schema: { type: string } }
      responses:
        "200":
          description: Durable team completion notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletionNotifications" }
  /ctf/instructor/notifications/{notificationId}/read:
    put:
      operationId: readCtfNotification
      parameters:
        - { in: header, name: x-instructor-code, required: true, schema: { type: string } }
        - { in: path, name: notificationId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /lantern/instructor/notifications/{notificationId}/read:
    put:
      operationId: readLanternNotification
      parameters:
        - { in: header, name: x-instructor-code, required: true, schema: { type: string } }
        - { in: path, name: notificationId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /ctf/instructor/answer-guide:
    get:
      operationId: getCtfInstructorAnswerGuide
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private question-by-question answer guide using current classroom keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructorAnswerGuide" }
        "401": { description: Instructor access denied }
        "503": { description: Instructor access is not configured }
  /lantern/instructor/answer-guide:
    get:
      operationId: getLanternInstructorAnswerGuide
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private guide for the revised six-mission activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructorAnswerGuide" }
        "401": { description: Instructor access denied }
        "503": { description: Instructor access is not configured }
  /lantern/activity:
    $ref: "./lantern.yaml#/paths/~1lantern~1activity"
  /lantern/progress:
    $ref: "./lantern.yaml#/paths/~1lantern~1progress"
  /lantern/progress/{sessionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1progress~1{sessionId}"
  /lantern/progress/{sessionId}/answers/{questionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1progress~1{sessionId}~1answers~1{questionId}"
  /lantern/progress/{sessionId}/submit:
    $ref: "./lantern.yaml#/paths/~1lantern~1progress~1{sessionId}~1submit"
  /lantern/progress/{sessionId}/hints/{missionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1progress~1{sessionId}~1hints~1{missionId}"
  /lantern/progress/{sessionId}/authorization:
    $ref: "./lantern.yaml#/paths/~1lantern~1progress~1{sessionId}~1authorization"
  /lantern/instructor/verify:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1verify"
  /lantern/instructor/keys:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1keys"
  /lantern/instructor/keys/{questionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1keys~1{questionId}"
  /lantern/instructor/submissions:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1submissions"
  /lantern/instructor/submissions/{sessionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1submissions~1{sessionId}"
  /lantern/instructor/submissions/{sessionId}/review/{questionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1submissions~1{sessionId}~1review~1{questionId}"
  /lantern/instructor/submissions/{sessionId}/history/{questionId}:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1submissions~1{sessionId}~1history~1{questionId}"
  /lantern/instructor/submissions/{sessionId}/authorization:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1submissions~1{sessionId}~1authorization"
  /lantern/instructor/submissions/{sessionId}/adjustments:
    $ref: "./lantern.yaml#/paths/~1lantern~1instructor~1submissions~1{sessionId}~1adjustments"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ctf/activity:
    get:
      operationId: getCtfActivity
      tags: [ctf]
      summary: Get the public activity questions and section briefs
      responses:
        "200":
          description: Activity definition without answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfActivity"
  /ctf/progress:
    post:
      operationId: createCtfProgress
      tags: [ctf]
      summary: Create or resume a learner's progress record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtfProgressInput"
      responses:
        "200":
          description: Existing progress restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfProgress"
        "201":
          description: New progress record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfProgress"
        "400":
          description: Invalid learner details
  /ctf/progress/{sessionId}:
    get:
      operationId: getCtfProgress
      tags: [ctf]
      summary: Retrieve saved progress using the private resume token
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved learner progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfProgress"
        "404":
          description: Progress was not found
  /ctf/progress/{sessionId}/answers/{questionId}:
    put:
      operationId: saveCtfAnswer
      tags: [ctf]
      summary: Save and validate one learner answer
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtfAnswerInput"
      responses:
        "200":
          description: Answer saved and scored if an answer key is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfAnswerResult"
        "404":
          description: Progress record or question was not found
  /ctf/progress/{sessionId}/submit:
    post:
      operationId: submitCtfProgress
      tags: [ctf]
      summary: Mark a learner's saved assessment ready for review
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Submitted progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfProgress"
        "404":
          description: Progress record was not found
  /ctf/instructor/questions:
    get:
      operationId: getCtfInstructorQuestions
      tags: [instructor]
      summary: List editable questions and missing original flag IDs
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private question definitions including accepted answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CtfQuestionCatalog" }
        "401": { description: Instructor access denied }
        "429": { description: Too many unsuccessful attempts }
        "503": { description: Instructor access is not configured }
  /ctf/instructor/questions/{questionId}:
    put:
      operationId: setCtfInstructorQuestion
      tags: [instructor]
      summary: Restore or edit a question without changing its original flag ID or learner responses
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema: { type: string }
        - in: path
          name: questionId
          required: true
          schema: { type: integer, minimum: 1, maximum: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CtfQuestionInput" }
      responses:
        "200":
          description: Question saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CtfInstructorQuestion" }
        "400": { description: Invalid question definition }
        "401": { description: Instructor access denied }
        "429": { description: Too many unsuccessful attempts }
        "503": { description: Instructor access is not configured }
  /ctf/instructor/verify:
    post:
      operationId: verifyCtfInstructor
      tags: [instructor]
      summary: Verify instructor access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtfInstructorVerifyInput"
      responses:
        "200":
          description: Instructor access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfInstructorVerifyResult"
        "503":
          description: Instructor access is not configured
  /ctf/instructor/keys:
    get:
      operationId: getCtfInstructorKeys
      tags: [instructor]
      summary: List instructor-configured dataset answer keys
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset-dependent answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfInstructorKeys"
        "401":
          description: Instructor access denied
        "503":
          description: Instructor access is not configured
  /ctf/instructor/keys/{questionId}:
    put:
      operationId: setCtfInstructorKey
      tags: [instructor]
      summary: Set the accepted response for a dataset-dependent question
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema:
            type: string
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtfInstructorKeyInput"
      responses:
        "200":
          description: Key saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfInstructorKey"
        "400":
          description: Key cannot be set for this question
        "401":
          description: Instructor access denied
  /ctf/instructor/submissions:
    get:
      operationId: listCtfSubmissions
      tags: [instructor]
      summary: List learner submissions for instructor review
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CtfSubmissionSummary"
        "401":
          description: Instructor access denied
  /ctf/instructor/submissions/{sessionId}:
    get:
      operationId: getCtfInstructorSubmission
      tags: [instructor]
      summary: Retrieve one submission with written responses
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Learner submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfProgress"
        "401":
          description: Instructor access denied
        "404":
          description: Submission was not found
  /ctf/instructor/submissions/{sessionId}/review/{questionId}:
    put:
      operationId: reviewCtfWrittenAnswer
      tags: [instructor]
      summary: Record a manual rubric score for a written answer
      parameters:
        - in: header
          name: x-instructor-code
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: questionId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CtfReviewInput"
      responses:
        "200":
          description: Manual score saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfProgress"
        "401":
          description: Instructor access denied
        "404":
          description: Submission or question was not found
components:
  schemas:
    InstructorAnswerGuide:
      type: object
      required: [title, notice, entries]
      properties:
        title: { type: string }
        notice: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/InstructorAnswerGuideEntry" }
    InstructorAnswerGuideEntry:
      type: object
      required: [id, code, section, sectionTitle, prompt, points, kind, source, answers, referenceAnswers, guidance, sampleResponse, notes, format]
      properties:
        id: { type: integer }
        code: { type: string }
        section: { type: integer }
        sectionTitle: { type: string }
        prompt: { type: string }
        points: { type: integer }
        kind: { type: string }
        source:
          type: string
          enum: [fixed, classroom, reference, manual, unconfigured, format]
        answers: { type: array, items: { type: string } }
        referenceAnswers: { type: array, items: { type: string } }
        guidance: { type: string }
        sampleResponse: { type: string }
        notes: { type: string }
        format: { type: string }
    CtfQuestionInput:
      type: object
      required: [prompt, kind, options, points, guideReference, validationMethod, validationMode, acceptedAnswers]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 12000 }
        kind: { type: string, enum: [single, multiple, short, number, long] }
        options:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 2000 }
        points: { type: integer, minimum: 0, maximum: 1000 }
        guideReference: { type: string, maxLength: 2000 }
        validationMethod: { type: string, maxLength: 12000 }
        validationMode:
          type: string
          enum: [normalised, exact, numeric, manual, dataset]
        acceptedAnswers:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 12000 }
    CtfInstructorQuestion:
      allOf:
        - $ref: "#/components/schemas/CtfQuestionInput"
        - type: object
          required: [id, section, sectionTitle]
          properties:
            id: { type: integer }
            section: { type: integer }
            sectionTitle: { type: string }
            facilitatorAnswers:
              type: array
              description: Instructor-only reference answers requiring classroom verification before saving.
              items: { type: string }
            facilitatorNote:
              type: string
              description: Instructor-only scoring and source reconciliation notes.
    CtfQuestionCatalog:
      type: object
      required: [questions, missingIds]
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/CtfInstructorQuestion" }
        missingIds:
          type: array
          items: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CtfQuestion:
      type: object
      required: [id, section, sectionTitle, prompt, kind, options, points, guideReference, correctAnswerAvailable, manualReview]
      properties:
        id: { type: integer }
        section: { type: integer }
        sectionTitle: { type: string }
        prompt: { type: string }
        kind:
          type: string
          enum: [single, multiple, short, number, long]
        options:
          type: array
          items: { type: string }
        points: { type: integer }
        guideReference: { type: string }
        correctAnswerAvailable: { type: boolean }
        manualReview: { type: boolean }
    CtfSection:
      type: object
      required: [id, title, time, flags, points, inject]
      properties:
        id: { type: integer }
        title: { type: string }
        time: { type: string }
        flags: { type: string }
        points: { type: integer }
        inject: { type: string }
    CtfActivity:
      type: object
      required: [title, course, duration, totalFlags, totalPoints, sections, questions]
      properties:
        title: { type: string }
        course: { type: string }
        duration: { type: string }
        totalFlags: { type: integer }
        totalPoints: { type: integer }
        sections:
          type: array
          items: { $ref: "#/components/schemas/CtfSection" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/CtfQuestion" }
    CtfAnswer:
      type: object
      required: [value, correct, earnedPoints, status, updatedAt]
      properties:
        value:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        correct: { type: ["boolean", "null"] }
        earnedPoints: { type: integer }
        status:
          type: string
          enum: [correct, incorrect, unkeyed, manual]
        updatedAt: { type: string, format: date-time }
        feedback: { type: string }
        instructorPoints: { type: ["integer", "null"] }
        instructorNote: { type: ["string", "null"] }
        reviewStatus: { type: string, enum: [pending, approved, denied] }
    CtfProgressInput:
      type: object
      required: [sessionId, name, email, instructorEmail, teamNumber]
      properties:
        sessionId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 140 }
        email: { type: string, format: email, maxLength: 254 }
        instructorEmail: { type: string, format: email, maxLength: 254 }
        teamNumber: { type: integer, minimum: 1, maximum: 9999 }
    CtfProgress:
      type: object
      required: [sessionId, name, email, instructorEmail, answers, totalPoints, answeredCount, savedAt, submittedAt]
      properties:
        sessionId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        instructorEmail: { type: string, format: email }
        teamNumber: { type: ["integer", "null"] }
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CtfAnswer"
        totalPoints: { type: integer }
        answeredCount: { type: integer }
        savedAt: { type: string, format: date-time }
        submittedAt: { type: ["string", "null"], format: date-time }
    CtfAnswerInput:
      type: object
      required: [value]
      properties:
        value:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    CtfAnswerResult:
      type: object
      required: [questionId, correct, earnedPoints, status, feedback, totalPoints]
      properties:
        questionId: { type: integer }
        correct: { type: ["boolean", "null"] }
        earnedPoints: { type: integer }
        status:
          type: string
          enum: [correct, incorrect, unkeyed, manual]
        feedback: { type: string }
        totalPoints: { type: integer }
    CtfInstructorVerifyInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
    CtfInstructorVerifyResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
    CtfInstructorKeyInput:
      type: object
      required: [acceptedAnswers]
      properties:
        onlyIfUnset:
          type: boolean
          description: Import a verified facilitator reference without replacing an existing classroom key.
        acceptedAnswers:
          type: array
          minItems: 1
          items: { type: string }
    CtfInstructorKey:
      type: object
      required: [questionId, acceptedAnswers]
      properties:
        questionId: { type: integer }
        acceptedAnswers:
          type: array
          items: { type: string }
    CtfInstructorKeys:
      type: array
      items: { $ref: "#/components/schemas/CtfInstructorKey" }
    CtfReviewInput:
      type: object
      required: [decision, responseUpdatedAt]
      properties:
        points: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 2000 }
        decision: { type: string, enum: [approved, approved_with_feedback, denied] }
        responseUpdatedAt: { type: string, format: date-time }
    CtfSubmissionSummary:
      type: object
      required: [sessionId, name, email, totalPoints, answeredCount, savedAt, submittedAt]
      properties:
        sessionId: { type: string, format: uuid }
        name: { type: string }
        teamNumber: { type: ["integer", "null"] }
        email: { type: string, format: email }
        totalPoints: { type: integer }
        answeredCount: { type: integer }
        savedAt: { type: string, format: date-time }
        submittedAt: { type: ["string", "null"], format: date-time }
    TeamLeaderboard:
      type: array
      items:
        type: object
        required: [teamNumber, percentage]
        properties:
          teamNumber: { type: integer }
          percentage: { type: integer, minimum: 0, maximum: 100 }
    ReviewQueue:
      type: array
      items:
        type: object
        required: [sessionId, name, teamNumber, questionId, code, prompt, value, points, updatedAt]
        properties:
          sessionId: { type: string, format: uuid }
          name: { type: string }
          teamNumber: { type: ["integer", "null"] }
          questionId: { type: integer }
          code: { type: string }
          prompt: { type: string }
          value: { type: string }
          points: { type: integer }
          updatedAt: { type: string, format: date-time }
    CompletionNotifications:
      type: array
      items:
        type: object
        required: [id, teamNumber, completedAt, readAt]
        properties:
          id: { type: string, format: uuid }
          teamNumber: { type: integer }
          completedAt: { type: string, format: date-time }
          readAt: { type: ["string", "null"], format: date-time }

