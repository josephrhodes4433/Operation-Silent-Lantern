# Single-origin dev proxy: the API and both CTF sites share host port 3000,
# mirroring how Replit routes them in production.
#
# Upstreams are passed through variables so nginx re-resolves container names via
# Docker's embedded DNS; otherwise a recreated service keeps the old IP and the
# preview 502s until the proxy is restarted.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 3000;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 20m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_buffering off;

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
  }

  location /silent-lantern/ {
    set $silent_upstream http://web-silent:18303;
    proxy_pass $silent_upstream$request_uri;
  }

  # Legacy IRON MERIDIAN entry links (/activity, /results, ...) redirect to the
  # /iron-meridian/ namespace, handled by the vite dev server.
  location / {
    set $iron_upstream http://web-iron:25140;
    proxy_pass $iron_upstream$request_uri;
  }
}
