name: ctf-workspace

# Development stack for the CTF workspace monorepo.
# - db:            local Postgres (schema applied by the one-shot `migrate` service)
# - install:       one-shot pnpm install (workspace root, lockfile preserving)
# - api:           @workspace/api-server on 8080 (mounted under /api by the proxy)
# - web-iron:      @workspace/iron-meridian-ctf vite dev server (BASE_PATH /iron-meridian/)
# - web-silent:    @workspace/silent-lantern-ctf vite dev server (BASE_PATH /silent-lantern/)
# - proxy:         single origin on host port 3000 (API + both sites), as production does

x-node: &node
  build:
    context: .
    dockerfile: .base44/dev-node.Dockerfile
  working_dir: /app
  volumes:
    - .:/app
  restart: on-failure

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf_dev_password
      POSTGRES_DB: ctf
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  install:
    <<: *node
    command:
      - sh
      - -ec
      - pnpm install --frozen-lockfile
    restart: "no"

  migrate:
    <<: *node
    command:
      - sh
      - -ec
      - pnpm --filter @workspace/db run push-force
    environment:
      DATABASE_URL: postgres://ctf:ctf_dev_password@db:5432/ctf
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *node
    command:
      - sh
      - -ec
      - exec pnpm --filter @workspace/api-server run dev
    environment:
      PORT: "8080"
      NODE_ENV: development
      DATABASE_URL: postgres://ctf:ctf_dev_password@db:5432/ctf
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    env_file:
      - /run/base44/app.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s

  web-iron:
    <<: *node
    command:
      - sh
      - -ec
      - exec pnpm --filter @workspace/iron-meridian-ctf run dev
    environment:
      PORT: "25140"
      BASE_PATH: /iron-meridian/
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    depends_on:
      install:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:25140/iron-meridian/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s

  web-silent:
    <<: *node
    command:
      - sh
      - -ec
      - exec pnpm --filter @workspace/silent-lantern-ctf run dev
    environment:
      PORT: "18303"
      BASE_PATH: /silent-lantern/
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    depends_on:
      install:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18303/silent-lantern/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s

  proxy:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web-iron:
        condition: service_healthy
      web-silent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/silent-lantern/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
