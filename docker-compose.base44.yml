# Base44 development compose for the CTF workspace.
# Runs the API server + SILENT LANTERN frontend from cloned source with live reload.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf_dev
      POSTGRES_DB: ctf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-shot: installs workspace deps and pushes the Drizzle schema to Postgres.
  deps:
    image: node:24
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      CI: "true"
      DATABASE_URL: "postgres://ctf:ctf_dev@db:5432/ctf"
    command:
      - sh
      - -ec
      - |
        corepack enable pnpm
        pnpm install --no-frozen-lockfile
        pnpm --filter @workspace/db run push
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: node:24
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://ctf:ctf_dev@db:5432/ctf"
      NODE_ENV: "development"
      BASE44_PREVIEW_MODE: "1"
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        corepack enable pnpm
        pnpm --filter @workspace/api-server run dev
    depends_on:
      deps:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: node:24
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      PORT: "3000"
      BASE_PATH: "/"
      API_PROXY_TARGET: "http://api:8080"
      BASE44_PREVIEW_MODE: "1"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${BASE44_PUBLIC_HOST_SUFFIX}"
    command:
      - sh
      - -ec
      - |
        corepack enable pnpm
        pnpm --filter @workspace/silent-lantern-ctf run dev
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
